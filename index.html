header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center;padding:6px 10px}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:12px;padding:4px 14px;white-space:nowrap}

nav .on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:820px;margin:auto;padding:16px 14px 60px}

.tree{text-align:center}.rt{display:inline-block;background:var(--ac);color:#fff;border-radius:12px;padding:4px 20px;font-weight:800}
.st{width:2px;height:14px;background:var(--bd);margin:0 auto}
.kids{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px;position:relative}

.nd.on{border-color:var(--ac);background:var(--cd)}
.panel{margin-top:14px;border-top:2px dashed var(--bd);padding-top:10px}
.ex{font-size:1.3rem;line-height:2.3}

.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}
.pt.on{outline:2px solid var(--tx)}

details{border-radius:16px;padding:6px 16px;margin:12px 0}
summary{cursor:pointer;font-weight:700}

table{width:100%;border-collapse:collapse;font-size:.95rem}th{background:var(--ac);color:#fff}

.nv{display:flex;justify-content:space-between;margin-top:20px}
.ov{overflow-x:auto}

const T=[
{t:'التشبيه',c:'صورة بيانية',d:'عقد مقارنة بين طرفين يشتركان في صفة، بأداة ظاهرة أو مقدّرة، لتقريب الصورة وتوضيح المعنى.',x:X0,

{n:'ناقص',s:'حُذف وجه الشبه أو الأداة',d:'يُحذف وجه الشبه وتبقى الأداة، أو تُحذف الأداة ويبقى وجه الشبه (العلم نور في هدايته).',x:[['الجندي','مشبّه'],[' كـ','أداة'],['الأسد','مشبّه به']],a:'حُذف وجه الشبه (الشجاعة). ومثله: الفتاة كالقمر.'},
{n:'بليغ',s:'حُذفت الأداة ووجه الشبه',d:'يبقى الطرفان فقط، وهو أقوى أنواع التشبيه لأنه يجعل المشبّه هو المشبّه به. وبعض المقررات تعدّه من الناقص.',x:[['العلمُ','مشبّه'],[' نورٌ','مشبّه به']]},

tip:'عدّ الأركان: أربعة = تام. غاب وجه الشبه أو الأداة = ناقص. غابا معًا = بليغ. صورة تُشبَّه بصورة وتتوسطهما أداة غالبًا = تمثيلي. صورة يعقبها دليل أو حقيقة بلا أداة = ضمني.',e:'عدّ «العلم نور» استعارة؛ طرفاه مذكوران فهو تشبيه بليغ. وعدّ «العلم كالنور» تمثيليًا؛ طرفاه مفردان فهو تام.'},
{t:'الاستعارة',c:'صورة بيانية',d:'استعمال اللفظ في غير معناه الأصلي لعلاقة المشابهة، مع قرينة تمنع إرادة المعنى الحقيقي. وهي تشبيه حُذف أحد طرفيه.',

tip:'ابحث عن كلمة لا تصح على حقيقتها (الصباح لا يبتسم). ثم اسأل: هل ذُكر المشبّه به؟ نعم = تصريحية. لا، بل ذُكر لازمه = مكنية.',e:'الخلط بينها وبين الكناية: الاستعارة علاقتها المشابهة ولا يصح فيها المعنى الأصلي.'},
{t:'الكناية',c:'صورة بيانية',d:'لفظ أُطلق وأُريد به معنى ملازم له، مع جواز إرادة المعنى الأصلي بحسب السياق.',

{n:'عن موصوف',s:'يُذكر ما يدل عليه دون اسمه',d:'الضاد حرف تنفرد به العربية. ومثله: أرض الكنانة (مصر).',x:[['لغةُ الضاد','المراد: اللغة العربية']]},
{n:'عن نسبة',s:'نسبة الصفة لما يتصل بالموصوف',d:'نُسب المجد إلى ثوبيه، والمراد إثباته لصاحبهما.',x:[['المجدُ','الصفة'],[' بين ثوبيه','ما اتصل بالموصوف']]}],

{n:'في نوع الحرف',x:[['بما كنتم ',''],['تفرحون','الفاء'],[' ... وبما كنتم ',''],['تمرحون','الميم']],a:'غافر: اختلفا في حرف واحد.'}]}],

{t:'السجع',c:'محسّن لفظي',d:'توافق أواخر الجمل (الفواصل) في الحرف الأخير أو النغمة في النثر.',cmp:CMP1,
n:[{n:'مجاله',s:'النثر لا الشعر',d:'قافية البيت الشعري ليست سجعًا.'},

function tabs(){$('#nv').innerHTML=['الرئيسية',...T.map(o=>o.t),'المراجعة'].map((t,i)=>`<button data-g="${i-1}" class="${i-1==ci?'on':''}">${t}</button>`).join('')}
function go(i){ci=i;cn=null;tabs();let h='';
if(i<0)h=`<div class="hero"><h1>بلاغة 12</h1><p>شرح تفاعلي للصور البيانية والمحسنات البديعية. اضغط على أي فن، ثم على أنواعه، ثم على أجزاء الأمثلة.</p></div><div class="card"><h3>الصور البيانية</h3><div class="g">${T.slice(0,3).map((o,j)=>`<button data-g="${j}">${o.t}<small>${o.n.length} أنواع</small></button>`).join('')}</div></div><div class="card"><h3>المحسنات البديعية</h3><p class="role">لفظية: الجناس والسجع. معنوية: الطباق والمقابلة.</p><div class="g">${T.slice(3).map((o,j)=>`<button data-g="${j+3}">${o.t}<small>${o.c}</small></button>`).join('')}</div></div>${det('card tip','كيف تستعمل الصفحة؟','اقرأ التعريف، ثم اضغط على النوع في المشجرة، ثم على أجزاء المثال لتعرف دور كل كلمة. وقد تختلف مسميات بعض الأنواع بين المقررات؛ فاعتمد كتابك المدرسي إن خالفها هذا الشرح.')}`;
else if(i>=T.length)h=`<h1>جدول المراجعة</h1><div class="card ov"><table><tr><th>الفن</th><th>العلامة المميّزة</th><th>مثال</th></tr>${REV.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>`;
else{const o=T[i];h=`<h1>${o.t} <span class="pill">${o.c}</span></h1><div class="card">${o.d}</div>${o.x?`<div class="card"><b>اضغط على أجزاء المثال</b>${ex(o.x)}</div>`:''}<div class="card"><b>مشجرة ${o.t}: اضغط على النوع</b><div class="tree"><div class="rt">${o.t}</div>${kids(o.n,'data-p')}</div><div class="panel" id="pn"><p class="role">اختر نوعًا من المشجرة.</p></div></div>${det('tip','كيف أتعرف عليه في الاختبار؟',o.tip)}${det('err','خطأ شائع',o.e)}${o.cmp?`<div class="card ov"><b>${o.cmp.t}</b><table><tr>${o.cmp.h.map(x=>`<th>${x}</th>`).join('')}</tr>${o.cmp.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`:''}`}
if(i>=0)h+=`<div class="nv">${i>0?`<button data-g="${i-1}">السابق</button>`:'<span></span>'}${i<T.length?`<button data-g="${i+1}">${i+1<T.length?'التالي':'المراجعة'}</button>`:''}</div>`;
M.innerHTML=h;scrollTo(0,0)}
function show(k,box){cn=k;box.innerHTML=nodeHtml(k)}
M.addEventListener('click',e=>{const t=e.target.closest('[data-g],[data-p],[data-q],.pt');if(!t)return;
if(t.dataset.g!=null)return go(+t.dataset.g);
if(t.classList.contains('pt')){const w=t.closest('.exw');w.querySelectorAll('.pt').forEach(p=>p.classList.remove('on'));t.classList.add('on');w.querySelector('.role').textContent=t.textContent.trim()+' ← '+t.dataset.r;return}
if(t.dataset.p!=null){document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b==t));return show(T[ci].n[+t.dataset.p],$('#pn'))}
if(t.dataset.q!=null){const k=cn.k[+t.dataset.q];document.querySelectorAll('[data-q]').forEach(b=>b.classList.toggle('on',b==t));$('#sub').innerHTML=`<div class="panel">${nodeHtml(k)}</div>`}});
M.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.classList.contains('pt')){e.preventDefault();e.target.click()}});
$('#nv').addEventListener('click',e=>{const t=e.target.closest('[data-g]');if(t)go(+t.dataset.g)});
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
go(-1);
</script></body></html>
